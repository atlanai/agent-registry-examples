name: software-factory-pr-review-agent
display_name: Software Factory PR Review Agent
registry_id: agent_01m1ejp2w6fy0synanm0qp4akh
framework: kiro-cli
provider: daytona
environment: daytona-kiro-pr-review
skills:
  - secure-pr-review@2
  - test-impact-analysis@1
  - review-evidence-summary@1
entrypoint: kiro-cli chat --agent-engine v3 --agent pr-review --no-interactive --trust-all-tools --output-format stream-json
