name: kiro-pr-review-agent-api
display_name: Kiro PR Review Agent
registry_id: agent_01m1apcr8ve08r88tyh5pcsspr
framework: kiro-cli
provider: daytona
environment: daytona-kiro-pr-review
skills:
  - secure-pr-review@2
  - test-impact-analysis@1
  - review-evidence-summary@1
entrypoint: kiro-cli chat --agent-engine v3 --agent pr-review --no-interactive --trust-tools=read,grep,disclose_context --output-format stream-json
network:
  mode: limited
  allowed_hosts:
    - agentgateway.atlan.engineering
    - prod.us-east-1.auth.desktop.kiro.dev
    - prod.us-east-1.telemetry.desktop.kiro.dev
    - q.us-east-1.amazonaws.com
    - runtime.us-east-1.kiro.dev
    - management.us-east-1.kiro.dev
    - telemetry.us-east-1.kiro.dev
