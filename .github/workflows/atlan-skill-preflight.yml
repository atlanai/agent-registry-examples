name: Atlan Agent Registry preflight

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "skills/**"
      - ".atlan/package.json"

permissions: {}

concurrency:
  group: atlan-agent-registry-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Register Atlan Agent Registry preflight
        uses: atlanai/agent-registry-action@03d2634750b746cd0869a61c25a4eb1db77bf56f # fix/installer-digest-v0.1.2
        with:
          mode: preflight
          github-token: ${{ github.token }}
