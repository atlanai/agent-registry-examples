name: Kiro PR Review in Daytona

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiro-daytona-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out factory source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.25"
          enable-cache: true

      - name: Install the locked factory environment
        run: uv sync --locked

      - name: Verify and stage pinned Kiro CLI
        run: uv run python scripts/fetch_kiro.py

      - name: Run agent-authenticated Kiro review in Daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: |
          uv run registry-pr-review run-kiro \
            --diff factory/fixtures/risky-order-change.diff \
            --references registry/skill-references.json \
            --state registry/state.json \
            --output build/kiro-review/result.json

      - name: Upload sanitized review evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kiro-review-${{ github.run_id }}
          path: build/kiro-review
          if-no-files-found: error
          retention-days: 14
