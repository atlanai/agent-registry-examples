name: Sync skills to Atlan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".atlan/package.json"

permissions:
  contents: read

concurrency:
  group: atlan-skill-sync-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Registry publishing is configured
        id: credential
        env:
          ATLANAI_TOKEN: ${{ secrets.ATLANAI_TOKEN }}
        run: |
          set -euo pipefail
          if test -n "$ATLANAI_TOKEN"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## Registry sync is ready but not credentialed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the repository secret \`ATLANAI_TOKEN\`, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out full Git history
        if: steps.credential.outputs.configured == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish skills
        if: steps.credential.outputs.configured == 'true'
        uses: atlanai/agent-registry-action@03d2634750b746cd0869a61c25a4eb1db77bf56f # fix/installer-digest-v0.1.2
        with:
          working-directory: .
          prune: "false"
          skill-bindings: >-
            {"skills/secure-pr-review":"skill_01m11gr8cjekhb5gvqn0k4x1ny","skills/trace-driven-skill-improvement":"skill_01m11gt6ncek08kcxwmqnt0bah"}
        env:
          ATLANAI_TOKEN: ${{ secrets.ATLANAI_TOKEN }}
