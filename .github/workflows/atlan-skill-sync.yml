name: Sync skills to Atlan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".atlan/package.json"

permissions:
  contents: read

concurrency:
  group: atlan-skill-sync-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Registry publishing is configured
        id: credential
        env:
          ATLANAI_TOKEN: ${{ secrets.ATLANAI_TOKEN }}
        run: |
          set -euo pipefail
          if test -n "$ATLANAI_TOKEN"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## Registry sync is ready but not credentialed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the repository secret \`ATLANAI_TOKEN\`, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out full Git history
        if: steps.credential.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish skills
        if: steps.credential.outputs.configured == 'true'
        uses: atlanai/agent-registry-action@c15fee277eb5606f08546f0deea0b2f5b74ea26b # v0.1.1
        with:
          working-directory: .
          prune: "false"
        env:
          ATLANAI_TOKEN: ${{ secrets.ATLANAI_TOKEN }}
