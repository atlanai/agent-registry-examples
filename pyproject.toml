[project]
name = "registry-pr-review-demo"
version = "0.1.0"
description = "Generic GitHub PR-review agent demo using Daytona, LangGraph, and Atlan Registry"
readme = "README.md"
authors = [{ name = "Atlan" }]
requires-python = ">=3.12"
dependencies = [
    "atlan-ai==0.1.0",
    "daytona==0.205.1",
    "keyring==25.7.0",
    "langgraph==1.2.11",
]

[project.scripts]
registry-pr-review = "registry_pr_review_demo.cli:main"

[build-system]
requires = ["uv_build==0.9.25"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.uv]
exclude-newer = "2026-08-20T00:00:00Z"

[tool.uv.sources]
atlan-ai = { path = "vendor/atlan-ai/atlan_ai-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "opentelemetry-sdk==1.44.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
]
