<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Registry PR-review topology in the Data workspace</title>
  <desc id="desc">Daytona hosts two governed environments and agents. Each agent uses one Registry skill and emits sessions, outputs, and traces. The CLI agent proposes a new review-skill version.</desc>
  <defs>
    <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');text{font-family:'Funnel Display','Avenir Next',Avenir,Inter,system-ui,-apple-system,'Segoe UI',sans-serif}]]></style>
    <pattern id="gridDots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#E6E8F0"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#141517" opacity=".7"/></marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F34D77"/></marker>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.48 10H17.5A4.5 4.5 0 0117.5 19H7a5 5 0 01-.48-9.98A5.5 5.5 0 0117.48 10Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></symbol>
    <symbol id="i-computer" viewBox="0 0 24 24"><path d="M16 3H8C3.76 3 2 4.76 2 9v2c0 4.24 1.76 6 6 6h8c4.24 0 6-1.76 6-6V9c0-4.24-1.76-6-6-6Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m8 8-2 2 2 2m8-4 2 2-2 2m-3-5-2 6M8 21h8m-4-4v4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><path d="M13 7h-2c-5.6 0-7 1.4-7 7s1.4 7 7 7h2c5.6 0 7-1.4 7-7s-1.4-7-7-7Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 11v2m6-2v2m-5 4h4M4 14H2m20 0h-2M12 7c0-4-1-4-4-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5.5A9.8 9.8 0 005.33 3C2 3 2 4 2 6.4v9.26c0 2.84.4 2.84 3.33 2.84A9.8 9.8 0 0112 21V5.5Zm0 15.5V5.5A9.8 9.8 0 0118.67 3C22 3 22 4 22 6.4V12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/><path d="m21.7 14.9-.6-.6a1.1 1.1 0 00-1.5 0l-3.4 3.4a3.2 3.2 0 00-.9 1.6L15 21l1.7-.3a3.2 3.2 0 001.6-.9l3.4-3.4a1.1 1.1 0 000-1.5Z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><path d="M3 12c0-7 2-9 9-9s9 2 9 9-2 9-9 9-9-2-9-9Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 12h18M11 7.5h6M11 16.5h6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
    <symbol id="atlanMark" viewBox="0 0 233.21 72.63"><g fill="#2026D2"><path d="m52.52 22.45v48.82H37.88v-4.59c-3.22 3.71-8 5.95-14.55 5.95C10.54 72.63 0 61.41 0 46.86s10.54-25.77 23.33-25.77c6.54 0 11.33 2.24 14.55 5.95v-4.59Zm-14.64 24.41C37.88 39.54 33 35 26.26 35s-11.62 4.54-11.62 11.86 4.89 11.91 11.62 11.91 11.62-4.59 11.62-11.91Z"/><path d="M81.8 36.51v17.28c0 4.2 3.62 4.59 10.06 4.2v13.28c-19.13 2-24.7-3.81-24.7-17.48V36.51h-7.81V22.45h7.81v-9.27L81.8 8.79v13.66h10.06v14.06ZM100.15 0h14.65v71.27h-14.65ZM175.62 22.45v48.82H161v-4.59c-3.22 3.71-8 5.95-14.54 5.95-12.79 0-23.34-11.22-23.34-25.77s10.55-25.77 23.34-25.77c6.54 0 11.32 2.24 14.54 5.95v-4.59Zm-14.62 24.41C161 39.54 156.09 35 149.36 35s-11.62 4.59-11.62 11.91 4.88 11.91 11.62 11.91S161 54.18 161 46.86ZM233.21 41.3v30h-14.64V43.44c0-6-3.81-8.88-8.5-8.88-5.37 0-9.08 3.12-9.08 10.06v26.65h-14.65V22.45h14.65V27c2.64-3.61 7.52-5.95 14-5.95 9.81.04 18.21 7.07 18.21 20.25Z"/></g><circle cx="26.26" cy="46.86" r="6" fill="#62E1FC"/><circle cx="149.36" cy="46.86" r="6" fill="#62E1FC"/></symbol>
  </defs>
  <rect width="1200" height="720" fill="#FFF"/><rect width="1200" height="720" fill="url(#gridDots)"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#141517">A governed loop inside the <tspan fill="#2026D2">Data workspace</tspan></text>
  <text x="40" y="80" font-size="12" fill="#6B6E78">Two execution paths, exact skill fingerprints, one approval-gated improvement.</text>
  <rect x="40" y="104" width="1120" height="536" rx="16" fill="#FFF" stroke="#D4D6E0" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="64" y="136" font-size="12" font-weight="700" fill="#2026D2">DATA WORKSPACE</text>
  <path d="M280 224H360" stroke="#141517" stroke-width="1.5" opacity=".7" marker-end="url(#arrow)"/><path d="M280 224C320 224 320 368 360 368" fill="none" stroke="#141517" stroke-width="1.5" opacity=".7" marker-end="url(#arrow)"/>
  <path d="M600 184H680M600 368H680M920 184H960M920 368H960" fill="none" stroke="#141517" stroke-width="1.5" opacity=".7" marker-end="url(#arrow)"/>
  <path d="M800 240V504M840 424V504" fill="none" stroke="#141517" stroke-width="1.5" opacity=".7" marker-end="url(#arrow)"/>
  <path d="M1040 424C1040 472 920 472 920 504" fill="none" stroke="#141517" stroke-width="1.5" opacity=".7" marker-end="url(#arrow)"/>
  <path d="M1040 240C1040 280 800 272 800 312" fill="none" stroke="#141517" stroke-width="1.5" opacity=".7" marker-end="url(#arrow)"/>
  <path d="M920 344C944 344 944 184 960 184" fill="none" stroke="#F34D77" stroke-width="2.5" marker-end="url(#arrowPink)"/>
  <g><rect x="80" y="168" width="200" height="112" rx="12" fill="#F8F8FC" stroke="#E6E8F0"/><use href="#i-cloud" x="100" y="200" width="32" height="32" color="#141517"/><text x="148" y="212" font-size="16" font-weight="700" fill="#141517">Daytona provider</text><text x="148" y="236" font-size="12" fill="#6B6E78">Ephemeral cloud sandboxes</text></g>
  <g><rect x="360" y="128" width="240" height="112" rx="12" fill="#E6FAFE" stroke="#C5EFFA"/><use href="#i-computer" x="380" y="160" width="32" height="32" color="#2BB3CC"/><text x="428" y="172" font-size="16" font-weight="700" fill="#141517">SDK environment</text><text x="428" y="196" font-size="12" fill="#6B6E78">LangGraph + atlan_ai wheel</text></g>
  <g><rect x="360" y="312" width="240" height="112" rx="12" fill="#E6FAFE" stroke="#C5EFFA"/><use href="#i-computer" x="380" y="344" width="32" height="32" color="#2BB3CC"/><text x="428" y="356" font-size="16" font-weight="700" fill="#141517">CLI environment</text><text x="428" y="380" font-size="12" fill="#6B6E78">LangGraph + pinned atlanai</text></g>
  <g><rect x="680" y="128" width="240" height="112" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-bot" x="700" y="160" width="32" height="32" color="#2026D2"/><text x="748" y="172" font-size="16" font-weight="700" fill="#141517">SDK review agent</text><text x="748" y="196" font-size="12" fill="#6B6E78">Exports under its agent key</text></g>
  <g><rect x="680" y="312" width="240" height="112" rx="12" fill="#FDE6EC" stroke="#F8B8C8" stroke-width="1.25"/><use href="#i-bot" x="700" y="344" width="32" height="32" color="#F34D77"/><text x="748" y="356" font-size="16" font-weight="700" fill="#141517">CLI improvement agent</text><text x="748" y="380" font-size="12" fill="#6B6E78">Proposes, never self-publishes</text></g>
  <g><rect x="960" y="128" width="160" height="112" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-book" x="980" y="160" width="32" height="32" color="#2026D2"/><text x="1028" y="172" font-size="14" font-weight="700" fill="#141517">Review skill</text><text x="1028" y="196" font-size="12" fill="#6B6E78">v1 to v2</text></g>
  <g><rect x="960" y="312" width="160" height="112" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-book" x="980" y="344" width="32" height="32" color="#2026D2"/><text x="1028" y="356" font-size="14" font-weight="700" fill="#141517">Analysis skill</text><text x="1028" y="380" font-size="12" fill="#6B6E78">Trace evidence</text></g>
  <g><rect x="680" y="504" width="240" height="104" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-db" x="700" y="532" width="32" height="32" color="#2026D2"/><text x="748" y="544" font-size="16" font-weight="700" fill="#141517">Registry evidence</text><text x="748" y="568" font-size="12" fill="#6B6E78">Sessions · outputs · traces</text></g>
  <text x="64" y="620" font-size="12" fill="#6B6E78">Pink marks the only mutation proposal; every publication still requires human approval.</text>
  <use href="#atlanMark" x="1124" y="684" width="58" height="18" opacity=".92"/>
</svg>
