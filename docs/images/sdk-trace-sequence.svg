<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SDK trace sequence</title><desc id="desc">The operator starts an evaluation, the controller pulls a skill, Daytona runs LangGraph, and the Atlan SDK exports a fingerprinted trace before Registry readback.</desc>
  <defs>
    <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');text{font-family:'Funnel Display','Avenir Next',Avenir,Inter,system-ui,-apple-system,'Segoe UI',sans-serif}]]></style>
    <pattern id="gridSquares" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EEF0F7"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#141517" opacity=".7"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2BB3CC"/></marker>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M16 17.5c-2.3-2.5-6.7-2.5-9 0M14 10a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 22c8 0 9-1 9-9s-1-10-9-10-10 2-10 10 2 9 10 9Z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 17s6-4.4 6-6-6-6-6-6M12 19h8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><path d="M3 12c0-7 2-9 9-9s9 2 9 9-2 9-9 9-9-2-9-9Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 12h18M11 7.5h6M11 16.5h6" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 10A4.5 4.5 0 0117.5 19H7a5 5 0 01-.5-10A5.5 5.5 0 0117.5 10Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
    <symbol id="i-computer" viewBox="0 0 24 24"><path d="M16 3H8C4 3 2 5 2 9v2c0 4 2 6 6 6h8c4 0 6-2 6-6V9c0-4-2-6-6-6Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m8 8-2 2 2 2m8-4 2 2-2 2m-3-5-2 6M8 21h8m-4-4v4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/></symbol>
    <symbol id="atlanMark" viewBox="0 0 233.21 72.63"><g fill="#2026D2"><path d="m52.52 22.45v48.82H37.88v-4.59c-3.22 3.71-8 5.95-14.55 5.95C10.54 72.63 0 61.41 0 46.86s10.54-25.77 23.33-25.77c6.54 0 11.33 2.24 14.55 5.95v-4.59Zm-14.64 24.41C37.88 39.54 33 35 26.26 35s-11.62 4.54-11.62 11.86 4.89 11.91 11.62 11.91 11.62-4.59 11.62-11.91Z"/><path d="M81.8 36.51v17.28c0 4.2 3.62 4.59 10.06 4.2v13.28c-19.13 2-24.7-3.81-24.7-17.48V36.51h-7.81V22.45h7.81v-9.27L81.8 8.79v13.66h10.06v14.06ZM100.15 0h14.65v71.27h-14.65ZM175.62 22.45v48.82H161v-4.59c-3.22 3.71-8 5.95-14.54 5.95-12.79 0-23.34-11.22-23.34-25.77s10.55-25.77 23.34-25.77c6.54 0 11.32 2.24 14.54 5.95v-4.59Zm-14.62 24.41C161 39.54 156.09 35 149.36 35s-11.62 4.59-11.62 11.91 4.88 11.91 11.62 11.91S161 54.18 161 46.86ZM233.21 41.3v30h-14.64V43.44c0-6-3.81-8.88-8.5-8.88-5.37 0-9.08 3.12-9.08 10.06v26.65h-14.65V22.45h14.65V27c2.64-3.61 7.52-5.95 14-5.95 9.81.04 18.21 7.07 18.21 20.25Z"/></g><circle cx="26.26" cy="46.86" r="6" fill="#62E1FC"/><circle cx="149.36" cy="46.86" r="6" fill="#62E1FC"/></symbol>
  </defs>
  <rect width="1200" height="720" fill="#FFF"/><rect width="1200" height="720" fill="url(#gridSquares)"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#141517">The SDK exports from <tspan fill="#2026D2">inside Daytona</tspan></text>
  <text x="40" y="80" font-size="12" fill="#6B6E78">The exact Registry skill fingerprint travels with the invocation span.</text>
  <!-- lifelines -->
  <g stroke="#D4D6E0" stroke-width="1.25" stroke-dasharray="5 4"><path d="M120 192V624M360 192V624M600 192V624M840 192V624M1080 192V624"/></g>
  <!-- messages -->
  <g fill="none" stroke="#141517" stroke-width="1.5" opacity=".72" marker-end="url(#arrow)"><path d="M120 240H352"/><path d="M360 296H592"/><path d="M360 352H832"/><path d="M840 408H920V440H848"/><path d="M840 520H368"/><path d="M360 576H592"/><path d="M360 616H1072"/></g>
  <path d="M840 464H1072" fill="none" stroke="#2BB3CC" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <!-- label masks and labels -->
  <g fill="#FFF"><rect x="192" y="224" width="96" height="20"/><rect x="432" y="280" width="96" height="20"/><rect x="544" y="336" width="112" height="20"/><rect x="856" y="392" width="88" height="20"/><rect x="912" y="448" width="104" height="20"/><rect x="568" y="504" width="104" height="20"/><rect x="432" y="560" width="96" height="20"/><rect x="664" y="600" width="104" height="20"/></g>
  <g font-size="12" fill="#6B6E78" text-anchor="middle"><text x="240" y="240">start eval</text><text x="480" y="296">pull v1</text><text x="600" y="352">create sandbox</text><text x="900" y="408">run graph</text><text x="964" y="464">export OTLP</text><text x="620" y="520">result + trace id</text><text x="480" y="576">write session</text><text x="716" y="616">verify facades</text></g>
  <!-- headers -->
  <g><rect x="40" y="112" width="160" height="80" rx="12" fill="#F8F8FC" stroke="#E6E8F0"/><use href="#i-user" x="56" y="136" width="28" height="28" color="#141517"/><text x="92" y="148" font-size="14" font-weight="700" fill="#141517">Human</text><text x="92" y="168" font-size="12" fill="#6B6E78">operator</text></g>
  <g><rect x="280" y="112" width="160" height="80" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-terminal" x="296" y="136" width="28" height="28" color="#2026D2"/><text x="332" y="148" font-size="14" font-weight="700" fill="#141517">Controller</text><text x="332" y="168" font-size="12" fill="#6B6E78">local CLI</text></g>
  <g><rect x="520" y="112" width="160" height="80" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-db" x="536" y="136" width="28" height="28" color="#2026D2"/><text x="572" y="148" font-size="14" font-weight="700" fill="#141517">Registry</text><text x="572" y="168" font-size="12" fill="#6B6E78">skill + session</text></g>
  <g><rect x="760" y="112" width="160" height="80" rx="12" fill="#E6FAFE" stroke="#C5EFFA"/><use href="#i-cloud" x="776" y="136" width="28" height="28" color="#2BB3CC"/><text x="812" y="148" font-size="14" font-weight="700" fill="#141517">Daytona</text><text x="812" y="168" font-size="12" fill="#6B6E78">LangGraph</text></g>
  <g><rect x="1000" y="112" width="160" height="80" rx="12" fill="#FDE6EC" stroke="#F8B8C8"/><use href="#i-computer" x="1016" y="136" width="28" height="28" color="#F34D77"/><text x="1052" y="148" font-size="14" font-weight="700" fill="#141517">Trace gateway</text><text x="1052" y="168" font-size="12" fill="#6B6E78">durable ingest</text></g>
  <text x="40" y="664" font-size="12" fill="#6B6E78">The host never receives the Registry agent key; Daytona injects an opaque Secret placeholder.</text>
  <use href="#atlanMark" x="1124" y="684" width="58" height="18" opacity=".92"/>
</svg>
