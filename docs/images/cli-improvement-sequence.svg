  <rect width="1200" height="720" fill="#FFF"/><rect width="1200" height="720" fill="url(#gridCross)"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#141517">Evidence proposes; <tspan fill="#F34D77">a human publishes</tspan></text>
  <text x="40" y="80" font-size="12" fill="#6B6E78">The CLI agent reads a version-scoped trace and emits its own attributable analysis trace.</text>
  <g stroke="#D4D6E0" stroke-width="1.25" stroke-dasharray="5 4"><path d="M120 192V624M360 192V624M600 192V624M840 192V624M1080 192V624"/></g>
  <g fill="none" stroke="#141517" stroke-width="1.5" opacity=".72" marker-end="url(#arrow)"><path d="M360 240H592"/><path d="M600 296H832"/><path d="M840 352H608"/><path d="M600 408H368"/><path d="M360 464H592"/><path d="M600 520H832"/><path d="M840 576H1072"/></g>
  <path d="M1080 600H848" fill="none" stroke="#F34D77" stroke-width="2.5" marker-end="url(#arrowPink)"/>
  <path d="M840 632H368" fill="none" stroke="#141517" stroke-width="1.5" opacity=".72" marker-end="url(#arrow)"/>
  <g fill="#FFF"><rect x="432" y="224" width="96" height="20"/><rect x="672" y="280" width="96" height="20"/><rect x="672" y="336" width="96" height="20"/><rect x="432" y="392" width="96" height="20"/><rect x="432" y="448" width="96" height="20"/><rect x="672" y="504" width="96" height="20"/><rect x="912" y="560" width="96" height="20"/></g>
  <g font-size="12" fill="#6B6E78" text-anchor="middle"><text x="480" y="240">read traces</text><text x="720" y="296">GET facade</text><text x="720" y="352">evidence</text><text x="480" y="408">safe JSON</text><text x="480" y="464">POST OTLP</text><text x="720" y="520">trace receipt</text><text x="960" y="576">proposal</text><text x="960" y="600">approve v2</text><text x="604" y="632">return version 2</text></g>
  <g><rect x="40" y="112" width="160" height="80" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-db" x="56" y="136" width="28" height="28" color="#2026D2"/><text x="92" y="148" font-size="14" font-weight="700" fill="#141517">Review trace</text><text x="92" y="168" font-size="12" fill="#6B6E78">version 1</text></g>
  <g><rect x="280" y="112" width="160" height="80" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-bot" x="296" y="136" width="28" height="28" color="#2026D2"/><text x="332" y="148" font-size="14" font-weight="700" fill="#141517">Improver</text><text x="332" y="168" font-size="12" fill="#6B6E78">Daytona agent</text></g>
  <g><rect x="520" y="112" width="160" height="80" rx="12" fill="#E6FAFE" stroke="#C5EFFA"/><use href="#i-terminal" x="536" y="136" width="28" height="28" color="#2BB3CC"/><text x="572" y="148" font-size="14" font-weight="700" fill="#141517">atlanai CLI</text><text x="572" y="168" font-size="12" fill="#6B6E78">agent key</text></g>
  <g><rect x="760" y="112" width="160" height="80" rx="12" fill="#E7E9FB" stroke="#C9CEF7"/><use href="#i-book" x="776" y="136" width="28" height="28" color="#2026D2"/><text x="812" y="148" font-size="14" font-weight="700" fill="#141517">Registry</text><text x="812" y="168" font-size="12" fill="#6B6E78">trace + skill</text></g>
  <g><rect x="1000" y="112" width="160" height="80" rx="12" fill="#FDE6EC" stroke="#F8B8C8"/><use href="#i-user" x="1016" y="136" width="28" height="28" color="#F34D77"/><text x="1052" y="148" font-size="14" font-weight="700" fill="#141517">Human</text><text x="1052" y="168" font-size="12" fill="#6B6E78">approval gate</text></g>
  <text x="40" y="664" font-size="12" fill="#6B6E78">The proposal can change one local rule; only an approved publish creates Registry version 2.</text>
  <use href="#atlanMark" x="1124" y="684" width="58" height="18" opacity=".92"/>
</svg>
